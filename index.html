<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filmixo Movie Analysis - Master Control</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #1da1f2; --accent: #f5820d; --bg: #0b0f13; --surface: #161b22; --field-bg: #0d1117; --border: #30363d; --text: #e6edf3; --text-muted: #8b949e; --success: #238636; --error: #f85149; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px 10px; }
        .master-container { width: 100%; max-width: 950px; }
        header { text-align: center; margin-bottom: 15px; border-bottom: 1px solid var(--border); padding-bottom: 12px; }
        .brand-title { font-size: 24px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 2px; color: white; text-transform: uppercase; display: flex; align-items: center; justify-content: center; gap: 10px; line-height: 1; }
        .brand-title i { color: var(--accent); font-size: 20px; }
        .brand-subtitle { color: var(--text-muted); font-size: 10px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; opacity: 0.8; }
        .nav-tabs { display: flex; flex-direction: row !important; justify-content: center; align-items: center; gap: 10px; margin-bottom: 20px; width: 100%; padding: 0 10px; }
        .tab-btn { background: var(--surface); color: var(--text-muted); border: 1px solid var(--border); padding: 7px 15px; border-radius: 50px; font-weight: 700; font-size: 11px; cursor: pointer; transition: all 0.3s ease; text-transform: uppercase; letter-spacing: 0.5px; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
        .tab-btn.active { background: rgba(245, 130, 13, 0.15); color: var(--accent); border-color: var(--accent); box-shadow: 0 0 12px rgba(245, 130, 13, 0.2); }
        .panel-section { display: none; animation: fadeIn 0.3s ease; }
        .panel-section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .section-label { font-size: 11px; font-weight: 800; text-transform: uppercase; color: var(--accent); margin: 15px 0 8px 0; letter-spacing: 1.2px; border-left: 3px solid var(--accent); padding-left: 10px; }
        .input-group { margin-bottom: 12px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        label, .data-label { display: block; font-size: 11px; font-weight: 700; margin-bottom: 5px; color: var(--text-muted); text-transform: uppercase; }
        input, textarea, .editable-box { width: 100%; background: var(--field-bg); border: 1px solid var(--border); border-radius: 6px; padding: 12px 14px; color: white; font-size: 13px; transition: 0.2s; outline: none; display: block; height: auto; field-sizing: content; }
        textarea { min-height: 45px; line-height: 1.6; resize: none; overflow: hidden; }
        #up_paragraphs, #edit-paragraphs { min-height: 120px; }
        .editable-box { min-height: 50px; line-height: 1.6; white-space: pre-wrap; overflow-wrap: break-word; }
        input:focus, textarea:focus, .editable-box:focus { border-color: var(--primary); background: #0f131a; }
        .search-area { background: var(--surface); padding: 12px; border-radius: 8px; border: 1px solid var(--border); display: flex; gap: 10px; margin-bottom: 20px; }
        .search-btn { background: var(--primary); color: white; border: none; padding: 0 20px; border-radius: 6px; cursor: pointer; font-weight: 800; text-transform: uppercase; font-size: 12px; transition: 0.2s; white-space: nowrap; }
        .security-box { background: rgba(245, 130, 13, 0.03); padding: 15px; border-radius: 8px; border: 1px dashed var(--border); margin: 20px 0; }
        .action-area { display: flex; gap: 12px; justify-content: center; margin-top: 20px; flex-wrap: wrap; }
        .btn-action { padding: 12px 25px; border-radius: 6px; font-size: 12px; font-weight: 800; cursor: pointer; text-transform: uppercase; border: none; transition: 0.2s; color: white; min-width: 140px; }
        .btn-publish { background: var(--accent); box-shadow: 0 4px 15px rgba(245, 130, 13, 0.2); }
        .btn-update { background: var(--success); box-shadow: 0 4px 15px rgba(35, 134, 54, 0.2); }
        .btn-delete { background: var(--error); box-shadow: 0 4px 15px rgba(248, 81, 73, 0.2); }
        .status-msg { margin-top: 15px; text-align: center; font-weight: 600; font-size: 13px; min-height: 20px; }
        #auth-overlay { position: fixed; inset: 0; background: var(--bg); z-index: 9999; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .auth-card { background: var(--surface); padding: 30px; border-radius: 12px; border: 1px solid var(--border); width: 100%; max-width: 400px; }
        @media (max-width: 768px) { .grid-2 { grid-template-columns: 1fr; } .search-area { flex-direction: column; } }
    </style>
</head>
<body>

<div id="auth-overlay">
    <div class="auth-card">
        <div class="brand-title" style="margin-bottom: 20px;"><i class="fa-solid fa-lock"></i> Admin Login</div>
        <div class="input-group">
            <label>Admin Email</label>
            <input type="email" id="login-email" placeholder="email@example.com">
        </div>
        <div class="input-group">
            <label>Password</label>
            <input type="password" id="login-password" placeholder="••••••••">
        </div>
        <button class="btn-action btn-publish" style="width: 100%;" id="login-btn">Secure Login</button>
        <div id="auth-status" class="status-msg"></div>
    </div>
</div>

<div class="master-container">
    <header>
        <div class="brand-title"><i class="fa-solid fa-film"></i> Filmixo Movie Analysis</div>
        <div class="brand-subtitle">UNIFIED MASTER CONTROL PANEL</div>
    </header>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('uploader')"><i class="fa-solid fa-cloud-arrow-up"></i> Movie Uploader</button>
        <button class="tab-btn" onclick="switchTab('controller')"><i class="fa-solid fa-sliders"></i> Database Controller</button>
        <button class="tab-btn" id="logout-btn" style="color: var(--error);"><i class="fa-solid fa-power-off"></i> Logout</button>
    </div>

    <div id="uploader-section" class="panel-section active">
        <div class="section-label">Content Meta Data</div>
        <div class="input-group"><label><i class="fa-solid fa-file-signature"></i> Content Title</label><textarea id="up_title" placeholder="Example: Pushpa 2 (2025) Dual Audio"></textarea></div>
        <div class="input-group"><label><i class="fa-solid fa-image"></i> Poster / Thumbnail Link</label><textarea id="up_media" placeholder="https://link.com/photo.jpg"></textarea></div>
        <div class="grid-2">
            <div class="input-group"><label><i class="fa-solid fa-stopwatch"></i> Duration</label><textarea id="up_duration"></textarea></div>
            <div class="input-group"><label><i class="fa-brands fa-youtube"></i> YouTube ID</label><textarea id="up_ytInput" placeholder="Paste link or ID"></textarea></div>
        </div>
        <div class="section-label">Narrative / Description</div>
        <div class="input-group"><label><i class="fa-solid fa-align-left"></i> Article Paragraphs</label><textarea id="up_paragraphs" placeholder="Write movie details... Enter for new paragraph."></textarea></div>
        <div class="action-area"><button class="btn-action btn-publish" id="pubBtn" onclick="publishToCloud()">🚀 Publish Now</button></div>
        <div id="up_status" class="status-msg"></div>
    </div>

    <div id="controller-section" class="panel-section">
        <div class="search-area"><input type="text" id="ctrl_searchId" placeholder="Enter Content ID"><button class="search-btn" onclick="fetchData()"><i class="fa-solid fa-magnifying-glass"></i> Find</button></div>
        <div id="ctrl-content-display" style="display: none;">
            <div class="section-label">Live Preview & Edit</div>
            <div class="input-group"><span class="data-label">TITLE</span><div id="edit-title" class="editable-box" contenteditable="true"></div></div>
            <div class="input-group"><span class="data-label">POSTER LINK</span><div id="edit-media" class="editable-box" contenteditable="true"></div></div>
            <div class="grid-2">
                <div><span class="data-label">DURATION</span><div id="edit-duration" class="editable-box" contenteditable="true"></div></div>
                <div><span class="data-label">YOUTUBE EMBED</span><div id="edit-yt" class="editable-box" contenteditable="true"></div></div>
            </div>
            <div class="input-group"><span class="data-label">PARAGRAPHS</span><div id="edit-paragraphs" class="editable-box" contenteditable="true"></div></div>
            <div class="action-area">
                <button class="btn-action btn-update" id="upBtn" onclick="updateData()">🚀 Update</button>
                <button class="btn-action btn-delete" id="delBtn" onclick="deleteData()">🗑️ Delete</button>
            </div>
        </div>
        <div id="ctrl_status" class="status-msg"></div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.10/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/9.6.10/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, updateDoc, deleteDoc, increment, deleteField } from "https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore.js";

    const firebaseConfig = { apiKey: "AIzaSyCAsD8wucLsudzY5oNbiixLGyjN2apdV0Q", authDomain: "my-ad-analytics-4560a.firebaseapp.com", projectId: "my-ad-analytics-4560a", storageBucket: "my-ad-analytics-4560a.firebasestorage.app", messagingSenderId: "104213283950", appId: "1:104213283950:web:b5a25ecd54df809625127f" };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // Identity Verification Logic
    const overlay = document.getElementById('auth-overlay');
    onAuthStateChanged(auth, (user) => { if (user && user.uid === "IPxYb7uiFdMwLj7oZnnqNKWIzcL2") { overlay.style.display = 'none'; } else { overlay.style.display = 'flex'; } });

    document.getElementById('login-btn').onclick = async () => {
        const email = document.getElementById('login-email').value;
        const pass = document.getElementById('login-password').value;
        try { await signInWithEmailAndPassword(auth, email, pass); } catch (e) { document.getElementById('auth-status').innerHTML = `<span style="color:var(--error)">Access Denied!</span>`; }
    };
    document.getElementById('logout-btn').onclick = () => signOut(auth);

    // Helpers
    window.switchTab = (tab) => { 
        document.querySelectorAll('.panel-section, .tab-btn').forEach(el => el.classList.remove('active'));
        document.getElementById(tab+'-section').classList.add('active');
        document.querySelectorAll('.tab-btn')[tab === 'uploader' ? 0 : 1].classList.add('active');
    };

    function generateId() {
        const letters = 'abcdefghijklmnopqrstuvwxyz', numbers = '0123456789'; let res = [];
        for (let i = 0; i < 4; i++) res.push(letters.charAt(Math.floor(Math.random() * letters.length)));
        for (let i = 0; i < 2; i++) res.push(numbers.charAt(Math.floor(Math.random() * numbers.length)));
        res.sort(() => Math.random() - 0.5); const finalId = res.join('');
        return /\d{2}/.test(finalId) ? generateId() : finalId;
    }

    const getYTId = (input) => { const m = input.match(/^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/); return (m && m[2].length == 11) ? m[2] : input.trim(); };

    // Core Logic
    window.publishToCloud = async function() {
        const title = document.getElementById('up_title').value.trim();
        const btn = document.getElementById('pubBtn'); const status = document.getElementById('up_status');
        if(!title) { status.innerHTML = `<span style="color:var(--error)">Title Required!</span>`; return; }
        try {
            btn.disabled = true; status.innerText = "Syncing...";
            const fid = generateId(), now = new Date().toISOString(), vid = getYTId(document.getElementById('up_ytInput').value);
            const data = { id: fid, title: title, mediaImage: document.getElementById('up_media').value, videoDuration: document.getElementById('up_duration').value, uploadTime: now, lastUpdated: now, youtubeEmbed: vid ? `<iframe src="https://www.youtube.com/embed/${vid}" frameborder="0" allowfullscreen></iframe>` : "", paragraphs: document.getElementById('up_paragraphs').value.split('\n').filter(p => p.trim() !== '') };
            await setDoc(doc(db, "posts", fid), data);
            await setDoc(doc(db, "total_collection", "global_stats"), { total_posts: increment(1), lastUpdated: now }, { merge: true });
            await setDoc(doc(db, "total_collection", "total_id"), { [fid]: fid }, { merge: true });
            status.innerHTML = `<span style="color:var(--success)">✅ Published! ID: ${fid}</span>`;
            setTimeout(() => location.reload(), 1500);
        } catch (e) { status.innerHTML = `<span style="color:var(--error)">Error: ${e.message}</span>`; btn.disabled = false; }
    };

    window.fetchData = async () => {
        const id = document.getElementById('ctrl_searchId').value.trim(), status = document.getElementById('ctrl_status');
        try {
            const snap = await getDoc(doc(db, "posts", id));
            if (snap.exists()) {
                const d = snap.data(); window.currentId = id;
                document.getElementById('ctrl-content-display').style.display = 'block';
                document.getElementById('edit-title').innerText = d.title;
                document.getElementById('edit-media').innerText = d.mediaImage;
                document.getElementById('edit-duration').innerText = d.videoDuration;
                document.getElementById('edit-yt').innerText = d.youtubeEmbed;
                document.getElementById('edit-paragraphs').innerText = d.paragraphs.join('\n\n');
                status.innerHTML = `<span style="color:var(--success)">Loaded!</span>`;
            } else { status.innerHTML = `<span style="color:var(--error)">Not Found!</span>`; }
        } catch (e) { status.innerText = e.message; }
    };

    window.updateData = async () => {
        const now = new Date().toISOString(), status = document.getElementById('ctrl_status');
        try {
            await updateDoc(doc(db, "posts", window.currentId), { title: document.getElementById('edit-title').innerText, mediaImage: document.getElementById('edit-media').innerText, videoDuration: document.getElementById('edit-duration').innerText, youtubeEmbed: document.getElementById('edit-yt').innerText, paragraphs: document.getElementById('edit-paragraphs').innerText.split('\n').filter(p => p.trim() !== ''), lastUpdated: now });
            status.innerHTML = `<span style="color:var(--success)">✅ Updated!</span>`;
            setTimeout(() => location.reload(), 1500);
        } catch (e) { status.innerText = e.message; }
    };

    window.deleteData = async () => {
        if(!confirm("Delete forever?")) return;
        const status = document.getElementById('ctrl_status');
        try {
            await deleteDoc(doc(db, "posts", window.currentId));
            await updateDoc(doc(db, "total_collection", "total_id"), { [window.currentId]: deleteField() });
            await setDoc(doc(db, "total_collection", "global_stats"), { total_posts: increment(-1) }, { merge: true });
            status.innerHTML = `<span style="color:var(--error)">🗑️ Deleted!</span>`;
            setTimeout(() => location.reload(), 1500);
        } catch (e) { status.innerText = e.message; }
    };

    window.onload = () => { document.getElementById('up_duration').value = "02:" + Math.floor(Math.random()*40+10).toString().padStart(2,'0') + ":25"; };
    document.addEventListener('input', (e) => { if (e.target.tagName === 'TEXTAREA') { e.target.style.height = 'auto'; e.target.style.height = e.target.scrollHeight + 'px'; } });
</script>
</body>
</html>
